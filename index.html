<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Schedule</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <header class="hero">
      <div class="hero-content">
        <p class="subtitle" id="weekLabel" aria-live="polite"></p>
        <div class="hero-title-row">
          <h1>Class Schedule</h1>
          <img src="bongo-cat.gif" alt="" class="bongo-cat bongo-cat--title" aria-hidden="true" />
        </div>
      </div>
    </header>

    <main class="container">
      <section class="controls" aria-label="Timetable controls">
        <input id="icsUpload" type="file" accept=".ics,text/calendar" />
      </section>

      <section class="calendarPanel" aria-label="Monthly calendar">
        <div class="calendarHeader">
          <div class="calendarNavLeft">
            <button id="prevMonthBtn" type="button" aria-label="Go to previous month">&lt;</button>
            <button id="todayMonthBtn" type="button" aria-label="Go to current month">Today</button>
          </div>
          <h2 id="calendarMonthLabel" class="calendarMonthLabel"></h2>
          <button id="nextMonthBtn" type="button" aria-label="Go to next month">&gt;</button>
        </div>
        <div class="calendarWeekdays" aria-hidden="true">
          <span>Sun</span>
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
        </div>
        <div class="calendarGrid" id="monthCalendarGrid" aria-live="polite"></div>
      </section>

      <div class="grid-wrapper">
        <section class="grid" id="scheduleGrid" aria-live="polite"></section>
      </div>
    </main>

    <template id="classCardTemplate">
      <article class="classCard">
        <p class="classTime"></p>
        <h3 class="classTitle"></h3>
        <p class="classDetail classLocation"></p>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
